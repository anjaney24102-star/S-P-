openapi: 3.0.3
info:
  title: Financial AI Risk Engine
  version: 1.0.0
  description: Financial text ingestion, NLP analysis, risk-signal generation, and structured output APIs.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/events:
    post:
      summary: Ingest a single financial event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialEventInput'
      responses:
        '201':
          description: Event ingested successfully
        '400':
          description: Invalid payload
        '409':
          description: Duplicate event
  /api/v1/events/batch:
    post:
      summary: Ingest multiple financial events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/FinancialEventInput'
      responses:
        '201':
          description: Batch accepted
  /api/v1/events/recent:
    get:
      summary: Retrieve recently ingested events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent events list
  /api/v1/events/{eventId}/analyze:
    post:
      summary: Analyze a financial event with the NLP pipeline
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: NLP analysis created
        '200':
          description: Existing analysis reused
        '404':
          description: Event not found
  /api/v1/events/{eventId}/analysis:
    get:
      summary: Get analysis for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analysis result
  /api/v1/analyses/recent:
    get:
      summary: Retrieve recent NLP analyses
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent analyses list
  /api/v1/events/{id}/signal:
    post:
      summary: Generate a persisted Feature 3 risk signal from an existing NLP analysis
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Risk signal created }
        '200': { description: Existing signal returned }
        '404': { description: Event not found }
        '409': { description: Successful NLP analysis required }
    get:
      summary: Get the persisted risk signal for an event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Risk signal }
        '404': { description: Signal not found }
  /api/v1/signals:
    get:
      summary: List standardized machine-readable risk signals
      parameters:
        - { name: company, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: event_classification, in: query, schema: { type: string, enum: [Geopolitical, Macroeconomic, 'Credit Event', 'Merger/Acquisition', 'Product Launch', Regulatory, Legal, Earnings, 'Supply Chain', Cybersecurity, Other] } }
        - { name: sentiment, in: query, schema: { type: string, enum: [positive, neutral, negative] } }
        - { name: min_impact_score, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated standardized risk signals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSignals' }
              example:
                data:
                  - signal_id: sig_example
                    event_id: evt_example
                    timestamp: '2026-10-08T12:30:00.000Z'
                    source: news
                    company: { name: Tesla, ticker: TSLA }
                    sentiment: { score: -0.72, label: negative }
                    event: { classification: Geopolitical, confidence: 0.91 }
                    impact: { score: 8, confidence: 0.84 }
                    overall_confidence: 0.87
                    explanation: [Strong negative sentiment, High financial relevance, Geopolitical event directly affecting the company]
                meta: { page: 1, limit: 20, total: 100 }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/signals/recent:
    get:
      summary: Retrieve recent standardized risk signals
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: company, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: event_classification, in: query, schema: { type: string } }
        - { name: sentiment, in: query, schema: { type: string, enum: [positive, neutral, negative] } }
        - { name: min_impact_score, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Paginated recent signal list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSignals' }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/signals/{id}:
    get:
      summary: Retrieve one standardized risk signal by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Standardized risk signal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SingleSignal' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/entities/{entity}/signals:
    get:
      summary: Retrieve standardized signals for a company/entity
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: source, in: query, schema: { type: string } }
        - { name: event_classification, in: query, schema: { type: string } }
        - { name: sentiment, in: query, schema: { type: string, enum: [positive, neutral, negative] } }
        - { name: min_impact_score, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Paginated signals for the requested entity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSignals' }
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/entities:
    get:
      summary: List canonical financial entities
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [company, organization, government, person, country, financial_instrument] }
      responses:
        '200': { description: Entity catalog }
  /api/v1/entities/{id}:
    get:
      summary: Get a canonical financial entity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Entity found }
        '404': { description: Entity not found }
  /api/v1/entities/{id}/events:
    get:
      summary: List events mentioning a canonical entity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resolved entity events }
        '404': { description: Entity not found }
  /api/v1/entities/{id}/risk:
    get:
      summary: Get canonical entity risk summary and signals
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, default: 24h }
      responses:
        '200': { description: Entity risk summary and signals }
        '404': { description: Entity not found }
  /api/v1/warnings:
    get:
      summary: List current early-warning signals
      parameters:
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 6h }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [WATCH, ELEVATED, HIGH, CRITICAL] }
        - name: entity_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Early-warning signal list }
  /api/v1/entities/{id}/warnings:
    get:
      summary: List early warnings for a canonical entity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 6h }
      responses:
        '200': { description: Entity early-warning signals }
        '404': { description: Entity not found }
  /api/v1/entities/{id}/baseline:
    get:
      summary: Calculate and retrieve an entity risk baseline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 6h }
      responses:
        '200': { description: Entity risk baseline and history adequacy }
        '404': { description: Entity not found }
components:
  responses:
    ApiError:
      description: Structured API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { error: { code: INVALID_PARAMETER, message: page must be an integer. } }
  schemas:
    RiskSignal:
      type: object
      required: [signal_id, event_id, timestamp, source, company, sentiment, event, impact, overall_confidence, explanation]
      properties:
        signal_id: { type: string }
        event_id: { type: string }
        timestamp: { type: string, format: date-time }
        source: { type: string }
        company:
          type: object
          required: [name, ticker]
          properties:
            name: { type: string }
            ticker: { type: string, nullable: true }
        sentiment:
          type: object
          required: [score, label]
          properties:
            score: { type: number, minimum: -1, maximum: 1 }
            label: { type: string, enum: [positive, neutral, negative] }
        event:
          type: object
          required: [classification, confidence]
          properties:
            classification: { type: string, enum: [Geopolitical, Macroeconomic, 'Credit Event', 'Merger/Acquisition', 'Product Launch', Regulatory, Legal, Earnings, 'Supply Chain', Cybersecurity, Other] }
            confidence: { type: number, minimum: 0, maximum: 1 }
        impact:
          type: object
          required: [score, confidence]
          properties:
            score: { type: integer, minimum: 1, maximum: 10 }
            confidence: { type: number, minimum: 0, maximum: 1 }
        overall_confidence: { type: number, minimum: 0, maximum: 1 }
        explanation: { type: array, items: { type: string } }
    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    PaginatedSignals:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RiskSignal' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    SingleSignal:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RiskSignal' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    FinancialEventInput:
      type: object
      required:
        - source
        - title
        - content
        - published_at
        - language
        - event_type
      properties:
        source:
          type: string
          enum: [news, social, twitter, x, manual]
        source_event_id:
          type: string
          nullable: true
        title:
          type: string
        content:
          type: string
        url:
          type: string
          format: uri
          nullable: true
        author:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
        language:
          type: string
          example: en
        event_type:
          type: string
          example: macro
        metadata:
          type: object
          additionalProperties: true
