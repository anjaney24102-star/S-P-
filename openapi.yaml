openapi: 3.0.3
info:
  title: Financial AI Risk Engine
  version: 1.0.0
  description: Feature 1 - Real-Time Data Ingestion Engine for news, social, and manual financial events.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/events:
    post:
      summary: Ingest a single financial event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialEventInput'
      responses:
        '201':
          description: Event ingested successfully
        '400':
          description: Invalid payload
        '409':
          description: Duplicate event
  /api/v1/events/batch:
    post:
      summary: Ingest multiple financial events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/FinancialEventInput'
      responses:
        '201':
          description: Batch accepted
  /api/v1/events/recent:
    get:
      summary: Retrieve recently ingested events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent events list
  /api/v1/events/{eventId}/analyze:
    post:
      summary: Analyze a financial event with the NLP pipeline
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: NLP analysis created
        '200':
          description: Existing analysis reused
        '404':
          description: Event not found
  /api/v1/events/{eventId}/analysis:
    get:
      summary: Get analysis for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analysis result
  /api/v1/analyses/recent:
    get:
      summary: Retrieve recent NLP analyses
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent analyses list
  /api/v1/entities:
    get:
      summary: List canonical financial entities
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [company, organization, government, person, country, financial_instrument] }
      responses:
        '200': { description: Entity catalog }
  /api/v1/entities/{id}:
    get:
      summary: Get a canonical financial entity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Entity found }
        '404': { description: Entity not found }
  /api/v1/entities/{id}/events:
    get:
      summary: List events mentioning a canonical entity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resolved entity events }
        '404': { description: Entity not found }
  /api/v1/entities/{id}/risk:
    get:
      summary: Get canonical entity risk summary and signals
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, default: 24h }
      responses:
        '200': { description: Entity risk summary and signals }
        '404': { description: Entity not found }
  /api/v1/warnings:
    get:
      summary: List current early-warning signals
      parameters:
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 6h }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [WATCH, ELEVATED, HIGH, CRITICAL] }
        - name: entity_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Early-warning signal list }
  /api/v1/entities/{id}/warnings:
    get:
      summary: List early warnings for a canonical entity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 6h }
      responses:
        '200': { description: Entity early-warning signals }
        '404': { description: Entity not found }
  /api/v1/entities/{id}/baseline:
    get:
      summary: Calculate and retrieve an entity risk baseline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 6h }
      responses:
        '200': { description: Entity risk baseline and history adequacy }
        '404': { description: Entity not found }
components:
  schemas:
    FinancialEventInput:
      type: object
      required:
        - source
        - title
        - content
        - published_at
        - language
        - event_type
      properties:
        source:
          type: string
          enum: [news, social, manual]
        source_event_id:
          type: string
          nullable: true
        title:
          type: string
        content:
          type: string
        url:
          type: string
          format: uri
          nullable: true
        author:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
        language:
          type: string
          example: en
        event_type:
          type: string
          example: macro
        metadata:
          type: object
          additionalProperties: true
